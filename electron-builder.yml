appId: com.jewelpos.app
productName: Jewel POS
copyright: Jewel POS
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  # The tray icon is loaded at runtime by path, so it has to be inside the
  # package — buildResources alone only feeds the installer's own artwork.
  - resources/tray.ico
  - resources/icon.ico
# The native modules ship a .node binary that cannot be loaded from inside asar.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/@node-rs/**'
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # No code-signing certificate yet: Windows SmartScreen will warn on first run
  # until one is bought. Left explicit so it is a decision, not an oversight.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Jewel POS
  # The shop's data lives in %APPDATA%, never beside the exe, so uninstalling
  # or reinstalling the app cannot take the ledger with it.
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
# electron-updater feed: GitHub Releases on the project repo.
#
# A shop polls the release feed, downloads quietly in the background, and
# installs when the app is CLOSED — never mid-sale. See src/main/updater.ts,
# which also no-ops on an unreachable feed so an offline counter never sees an
# error it cannot act on.
#
# An update only reaches shops once a release is PUBLISHED. Building alone
# publishes nothing, so a draft or an unreleased build is invisible to them:
#   gh release create v<version> "dist/Jewel POS Setup <version>.exe" dist/latest.yml
publish:
  provider: github
  owner: malikHarisawan
  repo: jewel-pos
