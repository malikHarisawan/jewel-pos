<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jewel POS">
  <!-- Tray variant: no container, mark fills the frame. At 16px the app icon's
       rounded square eats most of the pixels and the gem turns to mush, so the
       stone stands alone here and the facets are cut back to the two that still
       read at that size. -->
  <g transform="translate(16 17.5)">
    <path d="M-13.5-3 L13.5-3 L0 13.5 Z" fill="#b2622d"/>
    <path d="M-13.5-3 L-8-11 L8-11 L13.5-3 Z" fill="#d67f48"/>
    <path d="M-8-11 L8-11 L5-3 L-5-3 Z" fill="#ffe1d0"/>
    <path d="M-5-3 L0 13.5 L5-3" fill="none" stroke="#5c3413" stroke-width="1.1"
          stroke-opacity=".5" stroke-linejoin="round"/>
  </g>
</svg>
